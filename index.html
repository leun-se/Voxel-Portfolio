<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Park Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="loading-screen">
        <div class="loading-text">Loading...</div>
    </div>

    <div id="experience">
        <canvas id="experience-canvas"></canvas>
    </div>

    <!-- Everything inside .modal-body is generated by showModal() in main.js -->
    <div class="modal hidden">
        <div class="modal-wrapper">
            <div class="modal-header">
                <h1 class="modal-title"></h1>
                <button class="modal-exit-button" aria-label="Close">exit</button>
            </div>
            <div class="modal-body"></div>
        </div>
    </div>

    <div class="ui-overlay">
        <h2>Controls</h2>
        <ul>
            <li><b>WASD / Arrow keys: </b>Move</li>
            <li><b>R: </b>Respawn</li>
            <li><b>Click: </b>Hover items to interact</li>
        </ul>
    </div>

    <div id="toggle-buttons">
        <button class="day-night-button" aria-label="Toggle day and night">
            <i class="fa-regular fa-sun"></i>
        </button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@v0.179.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.179.1/examples/jsm/"
        }
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script type="module" src="./main.js"></script>
</body>
</html>
